# Déploiement prod : authentification AWS par OIDC (rôle convertix-github-deploy), sans clé statique.
name: Deploy prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6 
        with:
          role-to-assume: arn:aws:iam::953101120440:role/convertix-github-deploy
          aws-region: eu-west-3

      - name: Vérifier l'identité AWS
        run: aws sts get-caller-identity