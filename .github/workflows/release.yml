name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          repository: Dhia-sel/convertix-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}

      - name: Bump image tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^\(\s*newTag:\).*/\1 ${VERSION}/" overlays/dev/kustomization.yaml
          grep newTag overlays/dev/kustomization.yaml

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "Aucun changement à commiter"
            exit 0
          fi
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git commit -m "chore(dev): bump convertix to ${VERSION}"
          git push origin main